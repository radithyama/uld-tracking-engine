# http-context settings for ULDPulse, installed to /etc/nginx/conf.d/ by
# deploy/gcp/deploy.sh. Rate-limit zones are keyed by client address.

server_tokens off;   # no nginx version in headers or error pages

# WebSocket upgrade helper
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Requests per second (pages, BFF, static assets) and per minute (sign-in,
# WebSocket upgrades). Bursts absorb normal page loads; floods get 429.
limit_req_zone  $binary_remote_addr zone=uld_web:10m    rate=20r/s;
limit_req_zone  $binary_remote_addr zone=uld_api:10m    rate=50r/s;
limit_req_zone  $binary_remote_addr zone=uld_signin:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=uld_ws:10m     rate=30r/m;
limit_conn_zone $binary_remote_addr zone=uld_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# WebSocket tickets travel in the query string; keep them out of access logs.
map $request_uri $uld_log_uri {
    "~^(?<uld_path>/ws[^?]*)\?"  "$uld_path?ticket=[redacted]";
    default                      $request_uri;
}
log_format uld_main '$remote_addr - $remote_user [$time_local] "$request_method $uld_log_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
